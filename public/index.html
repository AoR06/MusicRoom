<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musiq</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Hidden global file input -->
  <input type="file" id="file-input" accept=".mp3,audio/mpeg" style="display:none;" />

  <!-- HOME VIEW -->
  <main id="home-view" class="view">
    <header class="top-bar">
      <h1>Musiq</h1>
      <button class="theme-toggle-btn" type="button">🌓 Mode</button>
    </header>

    <div class="card-container">
      <form id="create-form" class="card">
        <h2>Host a Room</h2>
        <input id="create-username" placeholder="Your name" required />
        <button type="submit" class="btn btn-primary">Create Room</button>
      </form>

      <form id="join-form" class="card">
        <h2>Join a Room</h2>
        <input id="join-username" placeholder="Your name" required />
        <input id="join-code" placeholder="Room Code (5 letters)" maxlength="5" required />
        <button type="submit" class="btn btn-secondary">Join Room</button>
      </form>
    </div>
    <p id="home-error" class="error-msg"></p>
  </main>

  <!-- ROOM VIEW -->
  <main id="room-view" class="view hidden">
    <header class="top-bar">
      <button id="leave-btn" type="button">← Leave</button>
      <div class="room-info">Room: <strong id="room-code-display">-----</strong></div>
      <button class="theme-toggle-btn" type="button">🌓 Mode</button>
    </header>

    <div class="workspace">
      <section class="player-box">
        <h2 id="track-title">Nothing playing</h2>
        <p id="track-subtitle"></p>

        <div class="controls">
          <button id="play-pause-btn" type="button">Play / Pause</button>
          <button id="upload-btn" type="button" class="btn btn-primary">+ Add Song</button>
        </div>
        <p id="upload-status"></p>
      </section>

      <section class="queue-box">
        <h3>Queue</h3>
        <ul id="queue-list"></ul>
      </section>
    </div>
  </main>

  <audio id="audio-el" preload="auto"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
